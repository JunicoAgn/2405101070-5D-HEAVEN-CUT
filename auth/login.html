  <nav id="navbar" class="scrolled">
    <a href="../index.html" class="logo">HEAVEN <span>CUT</span></a>
    <button
      class="hamburger"
      id="hamburger"
      type="button"
      aria-label="Buka menu"
      aria-expanded="false"
      aria-controls="menu-utama"

      <span class="garis"></span>

  <section class="halaman-auth">

      <h1>Masuk</h1>
      <p class="sub">Selamat datang kembali di Heaven Cut.</p>
      <p id="pesan" class="pesan"></p>

      <form class="form" onsubmit="prosesLogin(event)">
        <input type="email" id="email" placeholder="Alamat Email" required />
        <input type="password" id="sandi" placeholder="Kata Sandi" required />
        <button type="submit" class="btn">Masuk</button>
      </form>

      <p class="ganti">Belum punya akun? <a href="register.html">Daftar</a></p>
      <p class="admin-link"><a href="../admin/login.html">Login sebagai Admin</a>
</p>
