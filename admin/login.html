<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - Heaven Cut</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>

  <section class="halaman-auth">
    <div class="kotak-auth">
      <h1>Login Admin</h1>
      <p class="sub">Khusus pengelola Heaven Cut.</p>
      <p id="pesan" class="pesan"></p>

      <form class="form" onsubmit="prosesLoginAdmin(event)">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn">Masuk</button>
      </form>

      <p class="ganti"><a href="../index.html">&larr; Kembali ke website</a></p>
    </div>
  </section>

  <script src="../assets/js/admin.js"></script>
</body>
</html>

<script src="assets/js/jam.js"></script>
</body>
</html>
